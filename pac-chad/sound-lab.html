<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pac-Chad Sound Check | Gameslop</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10130e;color:#fff1d0;font-family:Arial,sans-serif;padding:clamp(20px,5vw,64px)}main{max-width:1050px;margin:auto}small{color:#bfff67;letter-spacing:2px}h1{font:clamp(40px,7vw,76px) Impact,sans-serif;margin:14px 0}p{color:#b3b9a5;line-height:1.6}a{color:#bfff67}button{background:#1c2816;border:1px solid #566248;color:#fff1d0;padding:18px;text-align:left;cursor:pointer;font:700 15px Arial}button:hover,button:focus-visible{background:#324922;outline:2px solid #bfff67}button:disabled{opacity:.5}#sounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:30px 0}#sounds small{display:block;margin-bottom:10px;font:11px monospace}#status{min-height:26px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.primary{background:#ff240b}</style></head>
<body><main><small>GAMESLOP / PAC-CHAD</small><h1>SOUND CHECK.</h1><p>Arcade effects and character recordings. Preview individual cues or play the set at the game's relative volume levels.</p><nav><button id="all" class="primary">PLAY THE SET</button><button id="stop">STOP</button><a href="./">Back to Pac-Chad →</a></nav><p id="status" role="status">Choose a sound to listen.</p><section id="sounds" aria-label="Sound effects"></section></main>
<script type="module">
import {Audio} from './js/audio.mjs';import {SOUND_BANK} from './js/sound-bank.mjs';
const audio=new Audio(),status=document.getElementById('status');let sequence=0;
async function ready(){await audio.unlock();await audio.loading;if(audio.failed.size)status.textContent='Some sounds could not load. Refresh to retry.';}
async function play(id){const token=++sequence;audio.stop();await ready();if(token!==sequence)return;audio.last.clear();audio.event({type:id,tick:1,points:200});status.textContent=SOUND_BANK[id].label;}
for(const [i,[id,spec]] of Object.entries(SOUND_BANK).entries()){const button=document.createElement('button');const n=document.createElement('small');n.textContent=String(i+1).padStart(2,'0')+' / PLAY';button.append(n,document.createTextNode(spec.label||id));button.onclick=()=>play(id);document.getElementById('sounds').append(button);}
document.getElementById('stop').onclick=()=>{sequence++;audio.stop();status.textContent='Stopped.';};
document.getElementById('all').onclick=async()=>{const token=++sequence;audio.stop();await ready();for(const [id,spec] of Object.entries(SOUND_BANK)){if(token!==sequence)return;audio.last.clear();audio.event({type:id,tick:1,points:200});status.textContent=spec.label;await new Promise(r=>setTimeout(r,((audio.buffers.get(id)?.buffer.duration||.5)+.35)*1000));}if(token===sequence)status.textContent='Sound check complete.';};
document.addEventListener('visibilitychange',()=>{if(document.hidden){sequence++;audio.stop();}});
</script></body></html>

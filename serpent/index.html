<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0A0A">
<title>Armara Serpent</title>
<link id="favicon" rel="icon" href="skin/armara/logo.png">
<link rel="stylesheet" href="../_kit/kit.css">
</head>
<body>
<div id="app" class="app">
  <header class="title">
    <img id="titleLogo" class="mark" alt="">
    <h1 id="title" data-str="title">ARMARA SERPENT</h1>
    <p class="tagline" id="tagline"></p>
  </header>

  <main class="stage">
    <aside class="panel panel-left">
      <section class="stats">
        <div class="stat"><h2 data-str="score">SCORE</h2><output id="score">0</output></div>
        <div class="stat"><h2 data-str="length">LENGTH</h2><output id="length">3</output></div>
        <div class="stat stat-best"><h2 data-str="best">BEST</h2><output id="best">0</output></div>
      </section>
    </aside>

    <div class="wellwrap" id="wellwrap">
      <canvas id="well" aria-label="Playfield"></canvas>
      <div class="overlay" id="overlay">
        <p class="overlay-title" id="overlayTitle"></p>
        <p class="overlay-body" id="overlayBody"></p>
        <button class="overlay-btn" id="overlayBtn" type="button"></button>
      </div>
    </div>

    <aside class="panel panel-right">
      <section class="brand">
        <img id="brandLogo" alt="">
        <div class="wordmark" id="wordmark"></div>
      </section>
      <button id="mute" class="icon" type="button" aria-label="Toggle sound" aria-pressed="false">♪</button>
    </aside>
  </main>

  <nav class="touch" id="touch" aria-label="Touch controls">
    <button type="button" data-btn="left" aria-label="Turn left"></button>
    <button type="button" data-btn="up" aria-label="Turn up"></button>
    <button type="button" data-btn="down" aria-label="Turn down"></button>
    <button type="button" data-btn="right" aria-label="Turn right"></button>
  </nav>
</div>

<script src="../_kit/rng.js"></script>
<script src="../_kit/draw.js"></script>
<script src="../_kit/skin.js"></script>
<script src="../_kit/audio.js"></script>
<script src="../_kit/input.js"></script>
<script src="../_kit/shell.js"></script>
<script src="js/engine.js"></script>
<script src="js/renderer.js"></script>
<script src="js/game.js"></script>
</body>
</html>
